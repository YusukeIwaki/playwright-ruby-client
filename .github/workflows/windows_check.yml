name: Windows check
on: [pull_request]
jobs:
  windows_chrome_rspec:
    name: Chrome
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install playwright-core via Bun
        run: |
          bun add --no-save playwright-core@next
          bun run --bun playwright-core install chromium
          bun run --bun playwright-core install-deps chromium
      - run: bundle exec ruby development/generate_api.rb
      - name: Check example
        run: bundle exec rspec spec/integration/example_spec.rb
        env:
          PLAYWRIGHT_CLI_EXECUTABLE_PATH: bun run --bun ./node_modules/.bin/playwright-core
        timeout-minutes: 5
